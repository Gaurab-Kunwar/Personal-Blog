{% extends "base.html" %} {% block title %}New Post{% endblock %} {% block
content %}
<div class="card editor-card">
  <!-- Form Header Area -->
  <header class="editor-header">
    <h1>Create New Post</h1>
    <p>
      Draft your thoughts, format your content, and share it with the world.
    </p>
  </header>

  <!-- Post Creation Form -->
  <form method="POST" class="editor-form">
    <div class="form-group">
      <label for="title">Post Title</label>
      <input
        type="text"
        id="title"
        name="title"
        placeholder="Give your masterpiece a title..."
        required
        autocomplete="off"
      />
    </div>

    <div class="form-group">
      <label for="content">Article Body</label>
      <textarea
        id="content"
        name="content"
        rows="14"
        placeholder="Start writing something interesting..."
        required
      ></textarea>
    </div>

    <!-- Form Actions Control Row -->
    <div class="form-actions">
      <!-- Cancel button placed first for consistent mobile column-reverse stack ordering -->
      <a href="/dashboard" class="btn btn-secondary"> Cancel </a>

      <button type="submit" class="btn">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
        Publish Post
      </button>
    </div>
  </form>
</div>
{% endblock %}
