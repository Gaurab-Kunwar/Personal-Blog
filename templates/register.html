{% extends "base.html" %} {% block title %}Register{% endblock %} {% block
content %}
<div class="auth-wrapper">
  <div class="card auth-card">
    <header class="auth-header">
      <h1>Create Account</h1>
      <p>Join the community and start sharing your stories</p>
    </header>

    <form method="POST" class="auth-form">
      <div class="form-group">
        <label for="username">Choose Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="e.g., yourname"
          required
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="password">Create Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          required
          autocomplete="new-password"
        />
      </div>

      <button type="submit" class="btn btn-submit">Get Started</button>
    </form>

    <footer class="auth-footer">
      <p>Already have an account? <a href="/login">Sign in instead</a></p>
    </footer>
  </div>
</div>
{% endblock %}
