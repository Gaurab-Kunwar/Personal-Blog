{% extends "base.html" %} {% block title %}Edit Post{% endblock %} {% block
content %}
<div class="card editor-card">
  <header class="editor-header">
    <h1>Edit Post</h1>
    <p>Update your content and save the changes.</p>
  </header>

  <form method="POST" class="editor-form">
    <div class="form-group">
      <label for="title">Post Title</label>
      <input
        type="text"
        id="title"
        name="title"
        value="{{ post.title }}"
        placeholder="Give your masterpiece a title..."
        required
        autocomplete="off"
      />
    </div>

    <div class="form-group">
      <label for="content">Article Body</label>
      <textarea
        id="content"
        name="content"
        rows="14"
        placeholder="Start writing something interesting..."
        required
      >
{{ post.content }}</textarea
      >
    </div>

    <div class="form-actions">
      <a href="/dashboard" class="btn btn-secondary"> Cancel </a>

      <button type="submit" class="btn">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"
          ></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        Save Changes
      </button>
    </div>
  </form>
</div>
{% endblock %}
