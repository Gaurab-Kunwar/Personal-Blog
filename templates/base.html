<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blog{% endblock %}</title>
    <
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-main: #0b0f19;
            --bg-surface: #131a26;
            --bg-surface-hover: #1c2635;
            --border-color: #222f43;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --transition: all 0.2s ease-in-out;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Navigation Bar */
        nav {
            background: rgba(19, 26, 38, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 14px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand { 
            font-size: 1.15rem; 
            font-weight: 700; 
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }
        
        .brand:hover {
            opacity: 0.9;
        }

        nav .nav-links {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        nav a.nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
        }

        nav a.nav-link:hover { 
            color: var(--text-primary); 
        }

        /* Container Layout */
        .container {
            max-width: 760px;
            margin: 48px auto;
            padding: 0 24px;
        }

        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--text-primary);
            color: var(--bg-main);
            padding: 10px 20px;
            border-radius: var(--radius-md);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn:hover { 
            background: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        }
        
        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--bg-surface-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        
        .btn-secondary:hover {
            background: var(--border-color);
            box-shadow: none;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-danger:hover { 
            background: var(--danger-hover);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }

        
        .flash {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            padding: 14px 20px;
            margin-bottom: 24px;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        /* Sleek Cards */
        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
            transition: var(--transition);
        }
        
        .card:hover {
            border-color: #2e3f5a;
        }

        
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, textarea {
            width: 100%;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-family: inherit;
            transition: var(--transition);
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        
        textarea {
            resize: vertical;
            min-height: 120px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        
        @media (max-width: 640px) {
            nav { padding: 14px 20px; }
            .container { margin: 24px auto; padding: 0 16px; }
            .card { padding: 20px; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="brand">📝 My Blog</a>
        <div class="nav-links">
            {% if current_user.is_authenticated %}
                <a href="/dashboard" class="nav-link">Dashboard</a>
                <a href="/post/new" class="nav-link">New Post</a>
                <a href="/logout" class="nav-link">Logout</a>
            {% else %}
                <a href="/login" class="nav-link">Login</a>
                <a href="/register" class="btn btn-secondary" style="padding: 6px 14px; font-size: 0.85rem;">Register</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash">⚡️ {{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
