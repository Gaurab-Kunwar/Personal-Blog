{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto;">
    <div class="card">
        <h1 style="margin-bottom: 8px;">Welcome back</h1>
        <p style="color: #888; margin-bottom: 24px;">Login to your account</p>

        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" placeholder="D3rLord" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>

            <button type="submit" class="btn" style="width: 100%;">Login</button>
        </form>

        <p style="color: #888; margin-top: 16px; text-align: center;">
            Don't have an account? <a href="/register" style="color: #fff;">Register</a>
        </p>
    </div>
</div>
{% endblock %}
